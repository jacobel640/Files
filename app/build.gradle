plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    // id 'kotlin-kapt'
    // id 'com.google.dagger.hilt.android'
}

// apply plugin: 'com.jakewharton.butterknife'

android {
    namespace 'com.example.files'
    compileSdk 36

    signingConfigs {
        release {
            storeFile file('/home/jacob/AndroidStudioProjects/key.jks')
            storePassword '123456'
            keyAlias 'key'
            keyPassword '123456'
        }
    }

    defaultConfig {
        applicationId "com.example.files"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
//            manifestPlaceholders
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // TODO change package name
//            manifestPlaceholders
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            applicationIdSuffix = ".debug"
//            versionNameSuffix '- Debug'
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
        aidl = true
        compose = true
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ViewModel & Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Hilt
    // implementation 'com.google.dagger:hilt-android:2.50'
    // annotationProcessor 'com.google.dagger:hilt-compiler:2.50'

    // Compose BOM & preparation
    def composeBom = platform('androidx.compose:compose-bom:2026.05.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }

    implementation ('com.github.bumptech.glide:glide:5.0.7') {
        exclude group: "com.android.support"
        transitive(true)
    }
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'
    implementation 'com.github.bumptech.glide:compose:1.0.0-beta01'

    //noinspection GradleCompatible
    implementation 'com.android.support:exifinterface:28.0.0'
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    // colorPickerDialog
    implementation 'com.github.QuadFlask:colorpicker:0.0.15'
//    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
//    implementation 'com.github.MFlisar:DragSelectRecyclerView:0.3'
//    implementation 'com.google.guava:guava:28.1-jre'
//    implementation 'com.github.cachapa:ExpandableLayout:2.9.2'
//    implementation 'com.github.aakira:expandable-layout:1.6.0@aar'
//    implementation "com.github.skydoves:expandablelayout:1.0.7"
//    implementation 'com.jakewharton:butterknife:10.2.3'
//    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
}